packages:
  - .

overrides:
  # OpenNext 1.20 requires the v8 minifier API.
  '@node-minify/core': 8.0.5
  # Pin patched transitive versions used by Next, Miniflare, and gray-matter.
  sharp: 0.35.4
  'js-yaml@3': 3.15.2
  fast-uri: 3.1.6
  postcss: ^8.5.19

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  sharp: true
  workerd: true

minimumReleaseAgeExclude:
  - fast-uri@3.1.6
  - brace-expansion@5.0.9
  - js-yaml@3.15.2
  - sharp@0.35.4
  - nanoid@3.3.18
