version: 2
updates:
  # JavaScript dependencies (GitHub names this ecosystem "npm" for npm-compatible registries)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    reviewers:
      - "aicodingstack/maintainers"
    assignees:
      - "aicodingstack/maintainers"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "automated"
    groups:
      # Separate group for Next.js updates
      nextjs:
        patterns:
          - "next"
          - "next-intl"
          - "react"
          - "react-dom"
        update-types:
          - "minor"
          - "patch"
      # Separate group for toolchain dependencies (riskier upgrades)
      toolchain:
        dependency-type: "development"
        patterns:
          - "@biomejs/*"
          - "@swc/*"
          - "esbuild"
          - "vite"
          - "rollup"
          - "@rollup/*"
          - "typescript"
        update-types:
          - "minor"
          - "patch"
      # Separate group for dev dependencies
      dev-dependencies:
        dependency-type: "development"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      # Group minor and patch updates together (prod deps only)
      minor-and-patch:
        dependency-type: "production"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
      - "github-actions"
      - "automated"
